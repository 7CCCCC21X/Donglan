# The Python version in place of the Rust one (RT_IMPL=python bash deploy/gcp/rt.sh update puts this file in
# /etc/systemd/system/ruletaker.service.d/; RT_IMPL=rust takes it out). Same settings file, same records.
[Service]
Environment=PYTHONUNBUFFERED=1
Environment=PYTHONPATH=/opt/ruletaker/python
WorkingDirectory=/opt/ruletaker/python
ExecStart=
ExecStart=/opt/ruletaker/python/venv/bin/python -u -m ruletaker run --env /etc/ruletaker/ruletaker.env
