# Put in /etc/systemd/system/ruletaker.service.d/ by vm-setup.sh only when the service did not start under the unit's added
# sandboxing (CapabilityBoundingSet= … RestrictAddressFamilies=): those lines undone, the rest of the unit as it is (its
# encrypted key and secrets still opened for it). Taken out again on the next update, which tries the sandbox once more.
[Service]
CapabilityBoundingSet=~
ProtectKernelLogs=no
ProtectClock=no
ProtectHostname=no
ProtectProc=default
ProcSubset=all
RestrictNamespaces=no
RestrictRealtime=no
RemoveIPC=no
SystemCallArchitectures=
MemoryDenyWriteExecute=no
RestrictAddressFamilies=
